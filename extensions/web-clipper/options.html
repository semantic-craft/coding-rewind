<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Rewind 网页扩展设置</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: rgba(0, 0, 0, 0.12);
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --ok: #1d8348;
      --err: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121316;
        --card: #1c1e24;
        --text: #f5f5f7;
        --muted: #98989d;
        --border: rgba(255, 255, 255, 0.14);
        --accent: #0a84ff;
        --accent-hover: #409cff;
        --ok: #30d158;
        --err: #ff453a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--text);
      font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }
    main {
      max-width: 540px;
      margin: 0 auto;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
    }
    p.subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 13px;
    }
    input[type="url"],
    input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      font-size: 13.5px;
      outline: none;
    }
    input[type="url"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0;
      font-size: 13px;
    }
    .checkbox-row label {
      margin: 0;
      font-weight: 400;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 8px 16px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    button.primary:hover {
      background: var(--accent-hover);
    }
    .meta {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--muted);
    }
    #status {
      margin-top: 14px;
      min-height: 20px;
      font-size: 13px;
    }
    #status[data-kind="ok"] { color: var(--ok); }
    #status[data-kind="error"] { color: var(--err); }
  </style>
</head>
<body>
  <main>
    <h1>Coding Rewind 网页扩展</h1>
    <p class="subtitle">在 ChatGPT、Claude、Gemini 中选中文字，通过右键菜单或 Alt+Shift+S 保存到 Memos。</p>

    <form id="settings-form">
      <div class="field">
        <label for="memos-url">服务地址</label>
        <input id="memos-url" type="url" autocomplete="url" placeholder="输入 Memos 服务地址" required>
      </div>

      <div class="field">
        <label for="memos-token">访问令牌</label>
        <input id="memos-token" type="password" autocomplete="off" placeholder="输入 Memos 访问令牌">
      </div>

      <div class="checkbox-row">
        <input id="show-pill" type="checkbox" checked>
        <label for="show-pill">选中文本时显示保存按钮</label>
      </div>

      <div class="actions">
        <button id="save-btn" type="submit" class="primary">保存设置</button>
        <button id="test-btn" type="button">检查连接</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="meta">
      <span id="outbox-count">待同步片段：0 条</span>
      <button id="flush-btn" type="button" hidden>立即同步</button>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
